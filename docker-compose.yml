db:
  image: postgres:16-alpine
  restart: unless-stopped
  environemnt:
    POSTGRES_USER: scheduler
    POSTGRES_PASSWORD: scheduler
    POSTGRES_DB: scheduler
  volumes:
    - db_data:/var/lib/postgresql/data
  ports:
    - "5432:5432"
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
    interval: 5s
    timeout: 5s
    retries: 10